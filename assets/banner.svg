<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="1" stop-color="#0b1210"/>
    </linearGradient>
    <radialGradient id="blast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b6ff3b" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#3ddc84" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dffb4"/>
      <stop offset="0.5" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#1f9e55"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e9eef2"/>
      <stop offset="1" stop-color="#b9c3cc"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2128"/>
      <stop offset="1" stop-color="#3a444f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6ff3b"/>
      <stop offset="0.5" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#e9fff1"/>
    </linearGradient>
    <clipPath id="capsule">
      <rect x="-150" y="-55" width="300" height="110" rx="55"/>
    </clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3ddc84" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- blast glow and shockwaves -->
  <circle cx="330" cy="210" r="260" fill="url(#blast)"/>
  <g fill="none" stroke="#3ddc84">
    <circle cx="330" cy="210" r="150" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="330" cy="210" r="195" stroke-opacity="0.10" stroke-width="2" stroke-dasharray="6 10"/>
    <circle cx="330" cy="210" r="240" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <!-- the bomb: a pump.fun pill with fins -->
  <g transform="translate(345 215) rotate(-28) scale(0.92)">
    <!-- exhaust flame -->
    <g filter="url(#glow)">
      <path d="M-222 -26 C-300 -40 -360 -10 -420 0 C-360 10 -300 40 -222 26 Z" fill="#ff7a1a" opacity="0.85"/>
      <path d="M-222 -16 C-280 -24 -320 -6 -360 0 C-320 6 -280 24 -222 16 Z" fill="#ffd400"/>
      <path d="M-222 -8 C-255 -10 -275 -3 -295 0 C-275 3 -255 10 -222 8 Z" fill="#fffbe6"/>
    </g>
    <!-- speed lines -->
    <g stroke="#3ddc84" stroke-linecap="round" opacity="0.5">
      <line x1="-235" y1="-30" x2="-330" y2="-30" stroke-width="4"/>
      <line x1="-240" y1="0" x2="-370" y2="0" stroke-width="5"/>
      <line x1="-235" y1="30" x2="-320" y2="30" stroke-width="4"/>
    </g>
    <!-- fins -->
    <g fill="url(#fin)" stroke="#58636f" stroke-width="2" stroke-linejoin="round">
      <polygon points="-105,-42 -190,-102 -222,-102 -168,-18"/>
      <polygon points="-105,42 -190,102 -222,102 -168,18"/>
      <rect x="-225" y="-9" width="105" height="18" rx="4"/>
    </g>
    <!-- capsule halves -->
    <g clip-path="url(#capsule)">
      <rect x="-150" y="-55" width="150" height="110" fill="url(#green)"/>
      <rect x="0" y="-55" width="150" height="110" fill="url(#white)"/>
      <rect x="-3" y="-55" width="6" height="110" fill="#0e3b22" opacity="0.55"/>
      <rect x="-130" y="-44" width="260" height="16" rx="8" fill="#ffffff" opacity="0.35"/>
    </g>
    <rect x="-150" y="-55" width="300" height="110" rx="55" fill="none" stroke="#0e3b22" stroke-width="3"/>
    <!-- radiation trefoil -->
    <g transform="translate(78 4)">
      <circle r="34" fill="#ffd400" stroke="#1a1a1a" stroke-width="3"/>
      <circle r="6" fill="#111"/>
      <g fill="#111">
        <path id="blade" d="M -5 -8.66 L -15 -25.98 A 30 30 0 0 1 15 -25.98 L 5 -8.66 A 10 10 0 0 0 -5 -8.66 Z"/>
        <use href="#blade" transform="rotate(120)"/>
        <use href="#blade" transform="rotate(240)"/>
      </g>
    </g>
  </g>

  <!-- sparks -->
  <g fill="#b6ff3b" filter="url(#glow)">
    <circle cx="520" cy="80" r="3"/>
    <circle cx="560" cy="130" r="2"/>
    <circle cx="140" cy="340" r="2.5"/>
    <circle cx="470" cy="360" r="2"/>
    <circle cx="190" cy="70" r="2"/>
  </g>

  <!-- title -->
  <g font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">
    <text x="620" y="200" font-size="104" font-weight="800" letter-spacing="6" fill="url(#title)" filter="url(#glow)">PUMPNUKE</text>
    <text x="624" y="250" font-size="24" font-weight="600" letter-spacing="7" fill="#8b98a5">VOLUME ENGINE FOR PUMP.FUN</text>

    <g font-size="15" font-weight="700" letter-spacing="1.5">
      <rect x="624" y="285" width="128" height="34" rx="17" fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84"/>
      <text x="688" y="307" text-anchor="middle" fill="#3ddc84">PAPER MODE</text>
      <rect x="764" y="285" width="148" height="34" rx="17" fill="#ffb020" fill-opacity="0.12" stroke="#ffb020"/>
      <text x="838" y="307" text-anchor="middle" fill="#ffb020">2 STRATEGIES</text>
      <rect x="924" y="285" width="128" height="34" rx="17" fill="#ff4d4d" fill-opacity="0.12" stroke="#ff4d4d"/>
      <text x="988" y="307" text-anchor="middle" fill="#ff4d4d">PANIC SELL</text>
      <rect x="1064" y="285" width="128" height="34" rx="17" fill="#4b8bff" fill-opacity="0.12" stroke="#4b8bff"/>
      <text x="1128" y="307" text-anchor="middle" fill="#4b8bff">DASHBOARD</text>
    </g>
  </g>
</svg>
