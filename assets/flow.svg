<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b98a5"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3ddc84"/>
    </marker>
  </defs>
  <rect width="1200" height="260" rx="16" fill="#0a0e12"/>

  <g font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" text-anchor="middle">
    <!-- arrows -->
    <g stroke="#8b98a5" stroke-width="2.5" marker-end="url(#arrow)">
      <line x1="212" y1="150" x2="253" y2="150"/>
      <line x1="449" y1="150" x2="490" y2="150"/>
      <line x1="686" y1="150" x2="727" y2="150"/>
      <line x1="923" y1="150" x2="964" y2="150"/>
    </g>

    <!-- master -->
    <rect x="20" y="95" width="190" height="110" rx="14" fill="#11161c" stroke="#e6edf3" stroke-width="2"/>
    <text x="115" y="143" font-size="20" font-weight="800" fill="#e6edf3">MASTER</text>
    <text x="115" y="168" font-size="13" fill="#8b98a5">your wallet</text>

    <!-- fund -->
    <rect x="257" y="95" width="190" height="110" rx="14" fill="#11161c" stroke="#ffb020" stroke-width="2"/>
    <text x="352" y="143" font-size="20" font-weight="800" fill="#ffb020">FUND POOL</text>
    <text x="352" y="168" font-size="13" fill="#8b98a5">N fresh wallets</text>

    <!-- initial buy -->
    <rect x="494" y="95" width="190" height="110" rx="14" fill="#11161c" stroke="#3ddc84" stroke-width="2"/>
    <text x="589" y="143" font-size="20" font-weight="800" fill="#3ddc84">INITIAL BUY</text>
    <text x="589" y="168" font-size="13" fill="#8b98a5">30–50% balance</text>

    <!-- cycles -->
    <rect x="731" y="95" width="190" height="110" rx="14" fill="#11161c" stroke="#3ddc84" stroke-width="2"/>
    <text x="826" y="143" font-size="20" font-weight="800"><tspan fill="#3ddc84">BUY</tspan><tspan fill="#8b98a5"> / </tspan><tspan fill="#ff4d4d">SELL</tspan></text>
    <text x="826" y="168" font-size="13" fill="#8b98a5">rotation · delays</text>
    <path d="M781 93 C781 30 871 30 871 91" fill="none" stroke="#3ddc84" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrowG)"/>
    <text x="826" y="35" font-size="13" font-weight="700" fill="#3ddc84">until duration ends</text>

    <!-- drain -->
    <rect x="968" y="95" width="210" height="110" rx="14" fill="#11161c" stroke="#4b8bff" stroke-width="2"/>
    <text x="1073" y="143" font-size="20" font-weight="800" fill="#4b8bff">SELL ALL</text>
    <text x="1073" y="168" font-size="13" fill="#8b98a5">drain SOL → master</text>

    <text x="600" y="240" font-size="12" fill="#56616d" letter-spacing="2">PHASE 1 → PHASE 2 → PHASE 3 → CLEANUP</text>
  </g>
</svg>
